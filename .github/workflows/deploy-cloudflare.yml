name: Deploy MREO to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mreo-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      SIGNWELL_API_KEY: ${{ secrets.SIGNWELL_API_KEY }}
      MREO_AGENT_EMAILS: ${{ secrets.MREO_AGENT_EMAILS }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY SIGNWELL_API_KEY MREO_AGENT_EMAILS; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Install project dependencies
        run: npm ci

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          identity="$(npx --yes wrangler@4.137.0 whoami --json)"
          account_id="$(IDENTITY="$identity" node -e '
            const body = JSON.parse(process.env.IDENTITY);
            const accounts = body.accounts || body.memberships || body.account || [];
            const first = Array.isArray(accounts) ? accounts[0] : accounts;
            const id = first?.id || first?.account_id || first?.account?.id || body.account_id;
            if (id) process.stdout.write(String(id));
          ')"
          if [[ -z "$account_id" ]]; then
            echo "Unable to determine the Cloudflare account identifier from the deployment token." >&2
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Provision D1 and R2
        id: resources
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="npx --yes wrangler@4.137.0"

          database_list="$($WRANGLER d1 list --json)"
          database_id="$(DB_LIST="$database_list" node -e '
            const list = JSON.parse(process.env.DB_LIST);
            const database = list.find((item) => item.name === "mreo-dev");
            if (database) process.stdout.write(database.uuid || database.id || database.database_id || "");
          ')"
          if [[ -z "$database_id" ]]; then
            $WRANGLER d1 create mreo-dev --location enam
            database_list="$($WRANGLER d1 list --json)"
            database_id="$(DB_LIST="$database_list" node -e '
              const list = JSON.parse(process.env.DB_LIST);
              const database = list.find((item) => item.name === "mreo-dev");
              if (database) process.stdout.write(database.uuid || database.id || database.database_id || "");
            ')"
          fi
          if [[ -z "$database_id" ]]; then
            echo "Unable to resolve the mreo-dev D1 database identifier." >&2
            exit 1
          fi

          DB_ID="$database_id" node <<'NODE'
          const fs = require("node:fs");
          const path = "wrangler.toml";
          const source = fs.readFileSync(path, "utf8");
          const updated = source.replace(/database_id = "[^"]+"/, `database_id = "${process.env.DB_ID}"`);
          if (updated === source && !source.includes(`database_id = "${process.env.DB_ID}"`)) {
            throw new Error("The D1 database binding could not be updated.");
          }
          fs.writeFileSync(path, updated);
          NODE

          if ! $WRANGLER r2 bucket list | grep -Fq 'mreo-documents-dev'; then
            $WRANGLER r2 bucket create mreo-documents-dev --location enam
          fi
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Apply transaction database migrations
        working-directory: backend
        run: npx --yes wrangler@4.137.0 d1 migrations apply mreo-dev --remote

      - name: Deploy Worker
        id: worker
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.137.0 deploy 2>&1 | tee /tmp/mreo-deploy.log
          api_base="$(sed -nE 's|.*(https://[A-Za-z0-9.-]+\.workers\.dev).*|\1|p' /tmp/mreo-deploy.log | tail -1)"
          if [[ -z "$api_base" ]]; then
            subdomain_json="$(curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
            subdomain="$(SUBDOMAIN_JSON="$subdomain_json" node -e '
              const body = JSON.parse(process.env.SUBDOMAIN_JSON);
              if (body.success && body.result?.subdomain) process.stdout.write(body.result.subdomain);
            ')"
            if [[ -n "$subdomain" ]]; then
              api_base="https://mreo-buysell-exchange.${subdomain}.workers.dev"
            fi
          fi
          if [[ -z "$api_base" ]]; then
            echo "Unable to determine the deployed Worker URL." >&2
            exit 1
          fi
          echo "api_base=$api_base" >> "$GITHUB_OUTPUT"

      - name: Configure Worker secrets
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          export ROOM_SIGNING_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          export HANDOFF_SIGNING_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          export SIGNWELL_WEBHOOK_TOKEN="$(openssl rand -hex 32)"
          node <<'NODE' > /tmp/mreo-worker-secrets.json
          const names = [
            "CLERK_PUBLISHABLE_KEY", "CLERK_SECRET_KEY", "SIGNWELL_API_KEY",
            "MREO_AGENT_EMAILS", "ROOM_SIGNING_SECRET", "HANDOFF_SIGNING_SECRET",
            "SIGNWELL_WEBHOOK_TOKEN", "STRIPE_SECRET_KEY", "STRIPE_WEBHOOK_SECRET"
          ];
          const secrets = Object.fromEntries(names.filter((name) => process.env[name]).map((name) => [name, process.env[name]]));
          process.stdout.write(JSON.stringify(secrets));
          NODE
          npx --yes wrangler@4.137.0 secret bulk /tmp/mreo-worker-secrets.json
          rm -f /tmp/mreo-worker-secrets.json
          echo "SIGNWELL_WEBHOOK_TOKEN=$SIGNWELL_WEBHOOK_TOKEN" >> "$GITHUB_ENV"

      - name: Register SignWell webhook
        shell: bash
        env:
          API_BASE: ${{ steps.worker.outputs.api_base }}
        run: |
          set -euo pipefail
          hooks="$(curl -fsS -H "X-Api-Key: $SIGNWELL_API_KEY" https://www.signwell.com/api/v1/hooks)"
          while IFS= read -r hook_id; do
            [[ -z "$hook_id" ]] && continue
            curl -fsS -o /dev/null -X DELETE -H "X-Api-Key: $SIGNWELL_API_KEY" \
              "https://www.signwell.com/api/v1/hooks/$hook_id"
          done < <(HOOKS="$hooks" API_BASE="$API_BASE" node -e '
            const body = JSON.parse(process.env.HOOKS);
            const hooks = Array.isArray(body) ? body : body.data || body.hooks || [];
            for (const hook of hooks) {
              if (String(hook.callback_url || "").startsWith(process.env.API_BASE + "/webhooks/signwell")) {
                process.stdout.write(String(hook.id) + "\n");
              }
            }
          ')
          callback_url="${API_BASE}/webhooks/signwell?token=${SIGNWELL_WEBHOOK_TOKEN}"
          status="$(CALLBACK_URL="$callback_url" node -e '
            process.stdout.write(JSON.stringify({callback_url: process.env.CALLBACK_URL}));
          ' | curl -sS -o /tmp/signwell-webhook-response.json -w '%{http_code}' \
            -X POST -H "X-Api-Key: $SIGNWELL_API_KEY" -H 'Content-Type: application/json' \
            --data-binary @- https://www.signwell.com/api/v1/hooks)"
          if [[ "$status" != "201" ]]; then
            echo "SignWell webhook registration returned HTTP $status." >&2
            exit 1
          fi

      - name: Verify connected services
        shell: bash
        env:
          API_BASE: ${{ steps.worker.outputs.api_base }}
        run: |
          set -euo pipefail
          config="$(curl -fsS "$API_BASE/api/v1/config")"
          CONFIG="$config" node -e '
            const config = JSON.parse(process.env.CONFIG);
            const required = ["connected", "authConfigured", "signwellConfigured", "realtimeConfigured"];
            const missing = required.filter((key) => config[key] !== true);
            if (missing.length) throw new Error(`Live configuration check failed: ${missing.join(", ")}`);
            if (config.signwellTestMode !== true) throw new Error("SignWell must remain in test mode for this deployment.");
          '

      - name: Connect the GitHub Pages frontend
        shell: bash
        env:
          API_BASE: ${{ steps.worker.outputs.api_base }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = "mreo-config.js";
          let source = fs.readFileSync(path, "utf8");
          source = source.replace('mode: "demo"', 'mode: "connected"');
          source = source.replace(/apiBase: "[^"]*"/, `apiBase: "${process.env.API_BASE}"`);
          fs.writeFileSync(path, source);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/wrangler.toml mreo-config.js
          if ! git diff --cached --quiet; then
            git commit -m "Connect MREO to Cloudflare services"
            git push origin HEAD:main
          fi

      - name: Deployment summary
        env:
          API_BASE: ${{ steps.worker.outputs.api_base }}
        run: |
          echo "### MREO connected deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: $API_BASE" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1: mreo-dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- R2: mreo-documents-dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- SignWell: test mode, webhook registered" >> "$GITHUB_STEP_SUMMARY"
