name: Copy MREO_BuySellProperty

on:
  push:
    paths:
      - ".github/workflows/copy-source.yml"

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy source repository
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          git clone --depth=1 https://github.com/PrototypeVersions/MREO_BuySellProperty.git "$temp_dir/source"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude=".git" "$temp_dir/source/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy MREO_BuySellProperty into MREO_BuySellPropertyA"
          git push origin HEAD:main
